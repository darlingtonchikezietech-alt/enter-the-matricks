; Device profiles for the supported headsets: Quest 2, Quest 3 and Quest 3S (bible P-31, tracker ADR-0003).
; Quest 2 is the performance floor. Quest 3 and 3S run the same settings until their own
; measurements justify more, and a quality increase may never change gameplay or readability.
;
; The engine's profiles (Engine/Config/BaseDeviceProfiles.ini, UE 5.8.4) match these headsets by name.
; Its Oculus_Quest2 profile sets sg.ShadowQuality=1 but its Meta_Quest_3 and Meta_Quest_3S profiles
; do not, so without the lines below Quest 3 would quietly render with different settings.
; Checked by the automation test ETM.Platform.DeviceProfiles (Source/ETM/Platform/Tests).

[Meta_Quest_3 DeviceProfile]
+CVars=sg.ShadowQuality=1

[Meta_Quest_3S DeviceProfile]
+CVars=sg.ShadowQuality=1

; Quest 2 baseline from PRODUCT_BIBLE.md section 14.
; Every key below was checked against Unreal Engine 5.8.4 in T-0005 (see docs/TOOLCHAIN.md).
; The editor reformats this file on first save; check that no value changes when it does.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry

[/Script/Engine.RendererSettings]
; Mobile forward, Mobile HDR off, multiview, 4x MSAA (Epic + Meta guidance)
r.MobileHDR=False
r.Mobile.ShadingPath=0
vr.MobileMultiView=True
r.MSAACount=4
r.Mobile.AntiAliasing=3
r.Mobile.UseHWsRGBEncoding=True
; Desktop (VR Preview over Link) uses forward + MSAA too, so the editor view matches the headset
r.ForwardShading=True
r.AntiAliasingMethod=3
; Baseline exclusions (section 14): no Lumen, no Nanite, no VSM, no RT, no motion blur, no DOF, no SSR, no volumetric fog
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Nanite.ProjectEnabled=False
r.Shadow.Virtual.Enable=0
r.RayTracing=False
r.GenerateMeshDistanceFields=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.Bloom=False
r.CustomDepth=0
r.AllowStaticLighting=True

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
; Placeholder package name: replace after title clearance (P-16). It cannot change after the first store upload.
PackageName=com.etm.prototype
StoreVersion=1
bBuildForArm64=True
bBuildForX8664=False
bSupportsVulkan=True
bBuildForES31=False
; Data inside the APK keeps device installs simple (no OBB) while the build is small.
bPackageDataInsideApk=True
; Meta Quest packaging through the engine's own OpenXR plugin (values from Epic's UE 5.8 VR template).
bPackageForMetaQuest=True
bPackageForOpenXRImmersive=True
ExtraApplicationSettings=<meta-data android:name="com.oculus.supportedDevices" android:value="quest2|questpro|quest3|quest3s" />
; Android 12L (API 32) is the Horizon OS base on Quest 2. Re-check against Meta's store rules before submission (T-0041).
MinSDKVersion=32
TargetSDKVersion=32

[/Script/AndroidPlatformEditor.AndroidSDKSettings]
; Compile against the platform the engine's Engine/Config/Android/Android_SDK.json asks for.
SDKAPILevel=android-36
NDKAPILevel=latest

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Mobile
DefaultGraphicsPerformance=Scalable

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
